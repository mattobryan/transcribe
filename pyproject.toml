[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-switching-transcriber"
version = "0.1.0"
description = "English-Swahili code-switching speech transcriber"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.15",
    "numba>=0.57,<0.68",
    "numpy>=1.24,<2.3",
    "scipy>=1.10,<1.16",
    "scikit-learn>=1.1",
    "editdistance>=0.6",
    "python-Levenshtein>=0.12",
    "nltk>=3.7",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

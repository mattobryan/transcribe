[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-switching-transcriber"
version = "0.2.0"
description = "Kenyan English-Kiswahili code-switching speech transcriber"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2.3",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.15",
    "numba>=0.57,<0.68",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<7.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
pilot = ["torch>=2.0", "transformers>=4.40,<5", "faster-whisper>=1.1,<1.3", "jiwer>=3.0,<5"]
ui = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.9"]
legacy = ["torch>=2.0", "scipy>=1.10,<1.16", "scikit-learn>=1.1", "editdistance>=0.6",
          "python-Levenshtein>=0.12", "nltk>=3.7", "PyYAML>=6.0"]
train = ["torch>=2.0", "transformers>=4.40,<5", "peft>=0.10", "jiwer>=3.0,<5"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
transcribe-pilot = "transcribe.pilot.run:main"
transcribe-pilot-batch = "transcribe.pilot.batch:main"
transcribe-pilot-mock = "transcribe.pilot.make_mock:main"
transcribe-app = "transcribe.app.__main__:main"
transcribe-review-stats = "transcribe.pilot.review_stats:main"
transcribe-train-prepare = "transcribe.train.prepare:main"
transcribe-train-eval = "transcribe.train.evaluate:main"
transcribe-finetune = "transcribe.train.finetune:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["transcribe*"]

[tool.setuptools.package-data]
transcribe = ["db/migrations/script.py.mako", "db/migrations/versions/*.py", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs", "notebooks"]

[tool.ruff.lint]
# Pyflakes (real errors: unused/undefined names, bad imports) + syntax.
select = ["F", "E9"]

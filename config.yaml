# Configuration for English-Swahili Code-Switching Transcriber

# Data settings
data_dir: "./data/audio"
metadata_file: "./data/metadata.json"
checkpoint_dir: "./checkpoints"

# Audio processing
sample_rate: 16000
n_mfcc: 13
n_fft: 2048
hop_length: 512

# Model architecture
hidden_dim: 256
num_layers: 3
dropout: 0.2
bidirectional: true

# Training parameters
batch_size: 16
learning_rate: 0.001
epochs: 100
save_every: 10
weight_decay: 0.0001

# Language settings
languages:
  - english
  - swahili
code_switching: true

# Vocabulary settings
min_char_frequency: 5
max_sequence_length: 200

# Evaluation
eval_every: 5
metrics:
  - wer
  - cer
  - bleu
